name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (migrations, typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # audit migrations (hors ligne) + typecheck + lint + vitest
      # Aucun secret ni accès DB : les tests d'isolation Postgres
      # (`pnpm test:security`) sont opt-in via RUN_DB_SECURITY_TESTS=1
      # et ne tournent pas ici.
      - run: pnpm check
